---
name: Validate Renovate Config

on:
  push:
    paths:
      - "*.json"
      - .github/scripts/*.mjs
      - .github/workflows/renovate-config-lint.yaml
      - tests/fixtures/**
  pull_request:
    paths:
      - "*.json"
      - .github/scripts/*.mjs
      - .github/workflows/renovate-config-lint.yaml
      - tests/fixtures/**
  workflow_dispatch: null

permissions:
  contents: read

jobs:
  validate-renovate-config:
    name: Validate Renovate configs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Validate shared Renovate configs
        run: |
          configs=()
          for config in ./*.json; do
            if [[ "$config" != "./renovate.json" ]]; then
              configs+=("${config#./}")
            fi
          done
          docker run --rm -v "$PWD":/work -w /work renovate/renovate:latest \
            renovate-config-validator --strict --no-global "${configs[@]}"

      - name: Validate repository Renovate config
        run: |
          docker run --rm -v "$PWD":/work -w /work renovate/renovate:latest \
            renovate-config-validator --strict --no-global renovate.json

      - name: Resolve Go preset with minimum Renovate version
        env:
          GITHUB_COM_TOKEN: ${{ github.token }}
          PRESET_REF: ${{ github.event.pull_request.head.sha || github.sha }}
          PRESET_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
        run: |
          set -euo pipefail
          consumer_dir="$(mktemp -d)"
          log_file="$(mktemp)"
          trap 'rm -rf "$consumer_dir"; rm -f "$log_file"' EXIT
          printf '{"extends":["github>%s:go#%s"]}\n' "$PRESET_REPOSITORY" "$PRESET_REF" \
            > "$consumer_dir/renovate.json"
          docker run --rm \
            -e GITHUB_COM_TOKEN \
            -e LOG_FORMAT=json \
            -v "$consumer_dir":/work -w /work \
            renovate/renovate:43.288.0@sha256:3b72fc4274c56f65f53dcd4dcbed3143289358e0a2d96f7af215e6cf1923e5f6 \
            renovate --platform=local --dry-run=extract 2>&1 | tee "$log_file"
          if grep -Fq '"msg":"Repository has invalid config"' "$log_file"; then
            exit 1
          fi

      - name: Validate capability preset behavior
        run: node .github/scripts/test-presets.mjs

      - name: Validate APM regex behavior
        run: node .github/scripts/validate-apm-regex.mjs
